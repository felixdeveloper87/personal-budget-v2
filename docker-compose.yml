services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-personalbudget}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-personalbudget}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://www.personalbudget.co.uk}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - HOUSEHOLD_CLEANING_ZONE=${HOUSEHOLD_CLEANING_ZONE:-Europe/London}
      - HOUSEHOLD_CLEANING_ASSIGNMENT_CRON=${HOUSEHOLD_CLEANING_ASSIGNMENT_CRON:-0 0 9 * * MON}
      - HOUSEHOLD_CLEANING_INCOMPLETE_CRON=${HOUSEHOLD_CLEANING_INCOMPLETE_CRON:-0 0 18 * * SUN}
      - HOUSEHOLD_PAYMENT_ZONE=${HOUSEHOLD_PAYMENT_ZONE:-Europe/London}
      - HOUSEHOLD_PAYMENT_REMINDER_CRON=${HOUSEHOLD_PAYMENT_REMINDER_CRON:-0 0 9 15,30 * *}
      - HOUSEHOLD_ATTACHMENTS_DIR=/app/uploads/household
    volumes:
      - household_uploads:/app/uploads/household
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React/Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_LOGO_DEV_TOKEN: ${VITE_LOGO_DEV_TOKEN:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
  household_uploads:

