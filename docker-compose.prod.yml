#========================================================================
# File: docker-compose.prod.yml
# Docker Compose para ambiente de produção
#========================================================================

services:
  # Banco de dados PostgreSQL

  #   docker compose -f docker-compose.prod.yml up
  #   docker compose -f docker-compose.prod.yml up -d
  #   docker compose -f docker-compose.prod.yml up -d --build backend
  #   docker compose -f docker-compose.prod.yml down
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-personalbudget}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-personalbudget}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - HOUSEHOLD_ATTACHMENTS_DIR=/app/uploads/household
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m -XX:+UseG1GC
    volumes:
      - household_uploads:/app/uploads/household
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  dbdata:
  household_uploads:

networks:
  app-network:
    driver: bridge
