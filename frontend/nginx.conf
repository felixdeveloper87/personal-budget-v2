server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Hashed build output: safe to cache forever. A missing file must be a real
    # 404 — falling back to index.html would hand the browser (and the service
    # worker's precache) an HTML page in place of a CSS/JS file.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker, its imports, the manifest and the app shell must always be
    # revalidated, or a new deploy is hidden behind the old cached version.
    location ~ ^/(sw\.js|registerSW\.js|push-sw\.js|workbox-[^/]+\.js|manifest\.webmanifest|index\.html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Servir arquivos estáticos do React
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy para API do backend (usado apenas em desenvolvimento local)
    location /api/ {
        client_max_body_size 26m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
