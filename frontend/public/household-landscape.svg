<svg xmlns="http://www.w3.org/2000/svg" width="768" height="900" viewBox="0 0 768 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c92da"/>
      <stop offset=".55" stop-color="#cdb9e8"/>
      <stop offset="1" stop-color="#f1d3bf"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8eb77b"/><stop offset="1" stop-color="#567f62"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#719a63"/><stop offset="1" stop-color="#365f4d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4d5860"/><stop offset=".55" stop-color="#26343b"/><stop offset="1" stop-color="#17262d"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5c2a86"/><stop offset="1" stop-color="#3a1658"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e9d4a4"/><stop offset="1" stop-color="#a9815a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1240" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#2a1240" stop-opacity=".05"/>
      <stop offset="1" stop-color="#1c0b2c" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2a1240" stop-opacity=".48"/><stop offset=".6" stop-color="#2a1240" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="windowGlow">
      <stop stop-color="#ffd778"/><stop offset=".58" stop-color="#e69b42"/><stop offset="1" stop-color="#8c4e2b"/>
    </radialGradient>
    <pattern id="brick" width="36" height="20" patternUnits="userSpaceOnUse">
      <rect width="36" height="20" fill="#a95134"/>
      <path d="M0 0h36M0 20h36M0 10h36M18 0v10M8 10v10" fill="none" stroke="#d38a65" stroke-width="2" opacity=".72"/>
    </pattern>
    <pattern id="slate" width="42" height="16" patternUnits="userSpaceOnUse" patternTransform="skewX(-8)">
      <rect width="42" height="16" fill="#303d44"/>
      <path d="M0 15.5h42M21 0v16" fill="none" stroke="#637078" stroke-width="1" opacity=".6"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#132d27" flood-opacity=".34"/>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

