    <!-- Saved accent colour before first paint; mirrors src/accent.ts. -->
    <script>
      (function () {
        try {
          var accent = localStorage.getItem('pb-accent')
          var bg = { blue: '#1a5fd6', pink: '#c81f6f' }[accent]
          if (bg) {
            document.documentElement.setAttribute('data-accent', accent)
            document.documentElement.style.background = bg
          }
        } catch (e) {}
      })()
    </script>
