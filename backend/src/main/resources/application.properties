spring.application.name=personalbudget

# Database Configuration - PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:personalbudget}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Redis (cache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
app.cache.monthly-summary-ttl-seconds=600
app.cache.user-list-ttl-seconds=600

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Sign-In (Web client ID from Google Cloud Console — same value as VITE_GOOGLE_CLIENT_ID on the frontend)
app.google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.web.public-url=${APP_PUBLIC_URL:https://www.personalbudget.co.uk}

# Resend configuration. The service remains disabled until both values are set.
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM_EMAIL:}

# Private Household proof images. Files live outside the database and are
# removed after 90 days; metadata remains so the ledger can show expiration.
app.household.attachments.directory=${HOUSEHOLD_ATTACHMENTS_DIR:./uploads/household}
app.household.attachments.max-files-per-record=5
app.household.attachments.max-file-size-bytes=5242880
app.household.attachments.retention-days=90
app.household.attachments.cleanup-cron=0 17 3 * * *

# Automatic weekly cleaning e-mails. Times use the household's operating timezone.
app.household.cleaning.email-zone=${HOUSEHOLD_CLEANING_EMAIL_ZONE:Europe/London}
app.household.cleaning.assignment-email-cron=${HOUSEHOLD_CLEANING_ASSIGNMENT_EMAIL_CRON:0 0 9 * * MON}
app.household.cleaning.incomplete-email-cron=${HOUSEHOLD_CLEANING_INCOMPLETE_EMAIL_CRON:0 0 18 * * SUN}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

