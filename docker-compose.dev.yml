services:
  # Comandos úteis (use sempre "docker compose" v2, plugin do Docker):
  #   docker compose -f docker-compose.dev.yml up
  #   docker compose -f docker-compose.dev.yml up -d
  #   docker compose -f docker-compose.dev.yml up -d --build backend
  #   docker compose -f docker-compose.dev.yml down
  # NÃO use o binário antigo docker-compose v1 (~1.29.x): em Docker Engine
  # recente dá KeyError 'ContainerConfig' ao recriar contentores.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-personalbudget}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend Spring Boot
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-personalbudget}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Frontend React/Vite com Hot Reload
  # ==================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"  # Porta do Vite dev server
    volumes:
      - ./frontend:/app  # Volume mount para hot reload
      - /app/node_modules  # Excluir node_modules do volume
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  dbdata:

# Sem nome fixo de rede Docker: assim o Compose cria algo como personal-budget-v2_app-network
# e evita o aviso "incorrect label … (expected: app-network)" quando já existia
# personal-budget-v2-network de outra versão/projeto Compose.
networks:
  app-network:
    driver: bridge
