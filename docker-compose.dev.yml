# =============================================================================
# File: docker-compose.dev.yml
# Descrição: Configuração do Docker Compose para ambiente de desenvolvimento
# =============================================================================
services:
  # Legenda dos mesmos comandos:
  #   docker compose -f docker-compose.dev.yml up
  #   docker compose -f docker-compose.dev.yml up -d
  #   docker compose -f docker-compose.dev.yml up -d --build backend
  #   docker compose -f docker-compose.dev.yml down
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-personalbudget}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Backend Spring Boot
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-personalbudget}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Frontend React/Vite com Hot Reload
  # ==================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"  # Porta do Vite dev server
    volumes:
      - ./frontend:/app  # Volume mount para hot reload
      - /app/node_modules  # Excluir node_modules do volume
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    networks:
      - app-network

volumes:
  dbdata:

# Sem nome fixo de rede Docker: assim o Compose cria algo como personal-budget-v2_app-network
# e evita o aviso "incorrect label … (expected: app-network)" quando já existia
# personal-budget-v2-network de outra versão/projeto Compose.
networks:
  app-network:
    driver: bridge
